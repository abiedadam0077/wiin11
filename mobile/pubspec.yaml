name: minebot_ai
description: MineBot AI - Flutter-native Minecraft Java bot manager.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  intl: ^0.20.2
  file_picker: ^10.3.11
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/voxel_hero.png
