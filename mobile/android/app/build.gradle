plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minebot.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.minebot.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                // The pinned Node 24 runtime headers use C++20 concepts.
                cppFlags '-std=c++20 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // CI-only installable artifact. This debug certificate is not suitable for Play Store or production.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDir("$buildDir/generated/node-assets")
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.register('syncNodeProject', Sync) {
    from(file('../../engine')) {
        include 'main.js', 'bot-manager.js', 'behavior-engine.js', 'package.json'
        into 'nodejs-project'
    }
    from(file('../../engine/node_modules')) {
        include '**/*'
        exclude '**/.bin/**', '**/test/**', '**/tests/**', '**/example/**', '**/examples/**', '**/doc/**', '**/docs/**', '**/sample/**', '**/samples/**', '**/.github/**'
        into 'nodejs-project/node_modules'
    }
    into "$buildDir/generated/node-assets"
}

tasks.named('preBuild').configure {
    dependsOn('syncNodeProject')
}
