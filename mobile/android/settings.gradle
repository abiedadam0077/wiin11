pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file("local.properties")
        assert localProperties.exists() : "mobile/android/local.properties must define flutter.sdk"
        localProperties.withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null : "flutter.sdk is not set in mobile/android/local.properties"
        return path
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

dependencyResolutionManagement {
    // Flutter's Gradle plugin contributes its own Maven repository for engine artifacts.
    // Prefer this centralized list instead of failing when the plugin declares it.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

rootProject.name = "MineBotAI"
include(":app")
