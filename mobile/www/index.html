<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MineBot AI — إدارة محلية وآمنة لسيرفرات وبوتات Minecraft ومهامها." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: file:; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>MineBot AI</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="app-shell" id="app-shell">
      <header class="topbar" id="topbar">
        <button class="brand-button" data-action="go-home" aria-label="الرئيسية">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.8 28 9.4v13.2L16 29.2 4 22.6V9.4L16 2.8Z"/><path d="m4.8 9.8 11.2 6.5 11.2-6.5M16 16.4v12M10 6.2l12 6.9"/><path d="m11.2 20 2.7 1.6 2.7-1.6 2.7 1.6 2.1-1.2"/></svg></span>
          <span class="brand-copy"><strong>MineBot <em>AI</em></strong><small id="top-context">إدارة ذكية لعالمك</small></span>
        </button>
        <div class="topbar-actions">
          <button class="icon-button" data-action="open-notifications" aria-label="الإشعارات"><span class="icon" data-icon="bell"></span><i class="notification-dot"></i></button>
          <button class="profile-chip" data-action="settings" aria-label="الإعدادات"><span class="profile-avatar">M</span><span class="profile-status"></span></button>
        </div>
      </header>

      <main class="screen" id="screen" aria-live="polite" aria-busy="true">
        <div class="loading-skeleton" aria-label="جار التحميل">
          <div class="skeleton-line w-45"></div><div class="skeleton-line w-75"></div>
          <div class="skeleton-grid"><div></div><div></div><div></div><div></div></div>
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="التنقل الرئيسي">
        <button class="nav-item is-active" data-route="home"><span class="nav-icon" data-icon="home"></span><span>الرئيسية</span></button>
        <button class="nav-item" data-route="bots"><span class="nav-icon" data-icon="bot"></span><span>بوتاتي</span></button>
        <button class="nav-item" data-route="tasks"><span class="nav-icon" data-icon="tasks"></span><span>المهام</span></button>
        <button class="nav-item" data-route="servers"><span class="nav-icon" data-icon="server"></span><span>السيرفرات</span></button>
        <button class="nav-item" data-route="settings"><span class="nav-icon" data-icon="settings"></span><span>الإعدادات</span></button>
      </nav>
    </div>

    <div id="overlay-root"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script defer src="./bundle.js"></script>
  </body>
</html>
