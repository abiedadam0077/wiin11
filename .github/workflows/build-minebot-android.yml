name: Build MineBot AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/edd985a9-wiin11
    paths:
      - 'mobile/**'
      - '.github/workflows/build-minebot-android.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install web build dependencies
        run: npm ci --prefix mobile

      - name: Build web assets
        run: npm --prefix mobile run build:web

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble APK
        run: gradle --no-daemon -p mobile/android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minebot-ai-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
