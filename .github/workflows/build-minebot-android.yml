name: Test Flutter and build MineBot AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/edd985a9-wiin11
    paths:
      - 'mobile/**'
      - '.github/workflows/build-minebot-android.yml'

permissions:
  contents: write

jobs:
  debug-apk:
    name: Analyze Flutter, test native engine, and assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies and generate localizations
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
          flutter analyze
          flutter test --reporter expanded

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/engine/package-lock.json

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "Android SDK command-line tools were not found under $sdk_root" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"

      - name: Configure Flutter and Android SDK paths for Gradle
        shell: bash
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.versionCode=2"
            echo "flutter.versionName=0.2.0"
          } > mobile/android/local.properties

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK and native build tools
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Fetch pinned Node.js 24 Android runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_zip="$RUNNER_TEMP/nodejs-mobile-android-24.20.0-0.zip"
          runtime_root="$RUNNER_TEMP/nodejs-mobile-android"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            'https://github.com/digidem/nodejs-mobile/releases/download/v24.20.0-0/nodejs-mobile-android-24.20.0-0.zip' \
            --output "$runtime_zip"
          echo 'f5ffbaf4f2679fa9180b0758c637c2f8fc8828300f95129badf213a028fb37bb  '"$runtime_zip" | sha256sum --check --status
          mkdir -p "$runtime_root"
          unzip -q "$runtime_zip" -d "$runtime_root"
          node_header="$(find "$runtime_root" -type f -path '*/include/node/node.h' -print -quit)"
          test -n "$node_header"
          header_root="${node_header%/node/node.h}"
          mkdir -p mobile/android/app/src/main/cpp/nodejs/include
          cp -a "$header_root/node" mobile/android/app/src/main/cpp/nodejs/include/
          for abi in arm64-v8a x86_64; do
            node_library="$(find "$runtime_root" -type f -path "*/bin/$abi/libnode.so" -print -quit)"
            test -n "$node_library"
            mkdir -p "mobile/android/app/src/main/jniLibs/$abi"
            cp "$node_library" "mobile/android/app/src/main/jniLibs/$abi/libnode.so"
          done

      - name: Install Minecraft engine dependencies
        run: npm ci --prefix mobile/engine

      - name: Test Minecraft engine logic
        run: npm --prefix mobile/engine test

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test native Android and assemble APKs
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace -p mobile/android :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease > "$RUNNER_TEMP/gradle-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ $result -ne 0 ]]; then
            {
              echo '### Gradle build failure details'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            compiler_details="$(grep -B 1 -A 4 -E 'error:| error:' "$RUNNER_TEMP/gradle-build.log" | tail -n 35 | tr '\n' ' ' | cut -c1-3500)"
            failure_details="$(awk '/^FAILURE: Build failed with an exception\./ {capture=1} capture {print; if (++count == 12) exit}' "$RUNNER_TEMP/gradle-build.log" | tr '\n' ' ' | cut -c1-2000)"
            details="$compiler_details $failure_details"
            if [[ -z "$compiler_details" && -z "$failure_details" ]]; then
              details="$(tail -n 25 "$RUNNER_TEMP/gradle-build.log" | tr '\n' ' ' | cut -c1-5000)"
            fi
            echo "::error title=Gradle build failure details::$details"
          fi
          exit "$result"

      - name: Upload Gradle diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minebot-ai-gradle-diagnostic
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: minebot-ai-android-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable Android APKs
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_APK: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK: mobile/android/app/build/outputs/apk/release/app-release.apk
          RELEASE_TAG: minebot-ai-flutter-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$DEBUG_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MineBot AI 0.2.0 Flutter Android APK #${GITHUB_RUN_NUMBER}" \
            --notes "Flutter/Dart Android build for commit ${GITHUB_SHA}. The Release APK is signed with the CI debug certificate for testing and is not a production or Play Store signature. Minecraft external-server login and device runtime still require separate verification." \
            --prerelease
