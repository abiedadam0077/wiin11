name: Build MineBot AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/edd985a9-wiin11
    paths:
      - 'mobile/**'
      - '.github/workflows/build-minebot-android.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "Android SDK command-line tools were not found under $sdk_root" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install web build dependencies
        run: npm ci --prefix mobile

      - name: Build web assets
        run: npm --prefix mobile run build:web

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace -p mobile/android :app:assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ $result -ne 0 ]]; then
            {
              echo '### Gradle build failure details'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            compiler_details="$(grep -B 1 -A 4 -E 'error:| error:' "$RUNNER_TEMP/gradle-build.log" | tail -n 35 | tr '\n' ' ' | cut -c1-3500)"
            failure_details="$(awk '/^FAILURE: Build failed with an exception\./ {capture=1} capture {print; if (++count == 12) exit}' "$RUNNER_TEMP/gradle-build.log" | tr '\n' ' ' | cut -c1-2000)"
            details="$compiler_details $failure_details"
            if [[ -z "$compiler_details" && -z "$failure_details" ]]; then
              details="$(tail -n 25 "$RUNNER_TEMP/gradle-build.log" | tr '\n' ' ' | cut -c1-5000)"
            fi
            echo "::error title=Gradle build failure details::$details"
          fi
          exit "$result"

      - name: Upload Gradle diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minebot-ai-gradle-diagnostic
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minebot-ai-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
